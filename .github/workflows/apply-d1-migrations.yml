name: Apply D1 migrations

# 예전에는 migration 파일 하나마다 `wrangler d1 execute --file`을 손으로 적어 뒀다.
# 새 파일을 추가할 때 이 목록을 같이 고치는 걸 잊으면 조용히 빠졌고(실제로 0015~0025가
# 전부 빠져 있었다), 이미 적용된 파일도 매번 다시 실행돼 ALTER TABLE에서 깨졌다.
# 지금은 wrangler의 d1 migrations를 쓴다 — `d1_migrations` 테이블에 적용 이력이 남아
# 새 파일만 이름 순으로 한 번씩 적용된다. 기존 데이터는 건드리지 않는다.

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: List pending migrations
        working-directory: worker-backend
        run: pnpm exec wrangler d1 migrations list parking-lot-navigator --remote

      - name: Apply pending migrations
        working-directory: worker-backend
        run: pnpm exec wrangler d1 migrations apply parking-lot-navigator --remote
