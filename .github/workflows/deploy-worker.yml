name: Deploy Worker

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "shared-types/**"
      - "worker-backend/**"
      - "package.json"
      - "package-lock.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-worker.yml"
      - ".github/workflows/apply-d1-migrations.yml"
  workflow_dispatch:

# 순서가 이 워크플로의 핵심이다: verify(테스트·타입체크) → migrate(원격 D1) →
# deploy(Worker) → smoke. 예전에는 migration이 별도 수동 워크플로였고 deploy만
# 자동이라, 새 컬럼을 읽는 Worker가 컬럼 없는 DB 위에 먼저 올라갈 수 있었다.
# needs 체인으로 앞 단계가 실패하면 뒤 단계가 아예 시작되지 않는다.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck Worker
        working-directory: worker-backend
        run: pnpm exec tsc --noEmit

      - name: Test Worker
        working-directory: worker-backend
        run: pnpm test

      - name: Test backend
        run: pnpm --filter @parking/backend test

  migrate:
    needs: verify
    uses: ./.github/workflows/apply-d1-migrations.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SYNC_ADMIN_TOKEN: ${{ secrets.SYNC_ADMIN_TOKEN }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync Worker API secrets
        working-directory: worker-backend
        run: |
          if [ -n "${NAVER_CLIENT_ID}" ]; then
            printf "%s" "${NAVER_CLIENT_ID}" | pnpm exec wrangler versions secret put NAVER_CLIENT_ID
          fi
          if [ -n "${NAVER_CLIENT_SECRET}" ]; then
            printf "%s" "${NAVER_CLIENT_SECRET}" | pnpm exec wrangler versions secret put NAVER_CLIENT_SECRET
          fi
          if [ -n "${KAKAO_REST_API_KEY}" ]; then
            printf "%s" "${KAKAO_REST_API_KEY}" | pnpm exec wrangler versions secret put KAKAO_REST_API_KEY
          fi

      - name: Deploy Worker
        working-directory: worker-backend
        run: pnpm exec wrangler deploy

      # Collection is driven by existing schedules; deployment must not force a national rescan.
      - name: Smoke test deployed Worker
        run: |
          curl -fsS "https://parking-lot-navigator-api.parkingnav.workers.dev/health" > /dev/null

      - name: Verify published snapshot without D1 reads
        working-directory: worker-backend
        run: node scripts/verify-discovery-snapshot.mjs
